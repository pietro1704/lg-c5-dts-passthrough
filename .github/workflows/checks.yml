name: Public source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/check-publication.py
      - run: bash -n build-plugin.sh
      - run: node --check verify-iec.mjs
      - run: node --test tests/verify-iec.test.mjs
      - run: bash -n native/build-module.sh
      - run: python3 native/checks.py
